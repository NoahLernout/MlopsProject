apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: used-car
data:
  DATABASE_URL: postgresql+psycopg2://carapi:carapi@postgres:5432/predictions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: used-car-api
  namespace: used-car
spec:
  replicas: 2                       # two pods behind one Service
  strategy:
    type: RollingUpdate             # zero-downtime updates
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: used-car-api}
  template:
    metadata:
      labels: {app: used-car-api}
    spec:
      containers:
        - name: api
          image: used-car-api:local   # replaced by the CI pipeline with an immutable :<git-sha> tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: api-config}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: used-car-api
  namespace: used-car
spec:
  type: NodePort
  selector: {app: used-car-api}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
