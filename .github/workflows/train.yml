name: Train model in Azure ML

# Training is separate from releasing the API (course 4.1): only run when data or training code changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["components/**", "environments/**", "pipelines/**", "computes/**"]

permissions:
  contents: read
  id-token: write      # OIDC login, no stored secrets

jobs:
  train:
    if: vars.AZURE_CLIENT_ID != ''   # skipped until the Azure OIDC repo variables are configured
    runs-on: ubuntu-24.04
    environment: mlops-demo
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add -n ml -y
      - name: Create environments and compute (idempotent)
        run: |
          az ml environment create -f environments/preprocessing.yaml -g "${{ vars.AZURE_RESOURCE_GROUP }}" -w "${{ vars.AZURE_ML_WORKSPACE }}"
          az ml environment create -f environments/training.yaml -g "${{ vars.AZURE_RESOURCE_GROUP }}" -w "${{ vars.AZURE_ML_WORKSPACE }}"
          az ml compute create -f computes/compute-cluster.yaml -g "${{ vars.AZURE_RESOURCE_GROUP }}" -w "${{ vars.AZURE_ML_WORKSPACE }}"
      - name: Submit the training pipeline
        run: |
          az ml job create -f pipelines/ai-pipeline.yaml --stream \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" -w "${{ vars.AZURE_ML_WORKSPACE }}" \
            --set display_name="train-${{ github.sha }}" tags.git_sha="${{ github.sha }}"
