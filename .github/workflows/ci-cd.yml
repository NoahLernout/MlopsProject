name: CI/CD - test, build and push the API image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["inference/**", "tests/**", "k8s/**", ".github/workflows/ci-cd.yml"]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r tests/requirements.txt
      - run: pytest -q tests

  build-and-push:
    needs: test
    # only runs once the Azure OIDC repo variables exist (see README); tests always run
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The model is not stored in git (inference/model is gitignored): pull the registered version from Azure ML.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Download registered model from Azure ML
        run: |
          az extension add -n ml -y
          az ml model download --name used-car-price --version 1 --download-path ./dl \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" -w "${{ vars.AZURE_ML_WORKSPACE }}"
          mkdir -p inference/model
          find ./dl -type f \( -name model.joblib -o -name metadata.json \) -exec cp {} inference/model/ \;
          ls -l inference/model
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/used-car-api
          tags: |
            type=sha
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: ./inference     # the model bundle must be in inference/model (downloaded from the registry)
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
